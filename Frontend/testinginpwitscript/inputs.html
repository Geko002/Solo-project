<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inputs
  </title>

  <script src="inputScript.js" defer></script>
</head>
<body>
  <form>

    <label for="name">Your name: </label>
    <input type="text" name="name" id="name" placeholder="name...">

    <p id="prev"></p>
    <br>
    <br>
    <label for="num">Your age: </label>
    <input type="number" name="num" id="num" placeholder="age...">
    
    <br>
    <br>
    <button type="button" id="but">Submit the form</button>


  </form>
</body>
</html>
