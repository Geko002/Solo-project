<div class="text">
  <h4><em>TRAINING LOG</em></h4>
  <p><em>Visualize your consitency</em></p>
</div>

<div class="container">

  <div class="calendar">

    
    <h3 id="month-title"></h3>

    <div class="weekdays">
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
      <div>Sun</div>
    </div>


  <div id="calendar-days"></div>

</div>


  <div class="form-container">

    <div class="workout-form">

      <h3>LOG WORKOUT</h3>

      <form>
       
        <label for="name">WORKOUT NAME</label>
        <input type="text" id="name" placeholder="Push day...">

        <label for="type">TYPE</label>
        <input type="text" id="type" placeholder="STRENGTH..">

        <label for="duration">DURATION (MINUTES)</label>
        <input type="number" id="duration" placeholder="30 min..."> 

        <label for="note">NOTES</label>
        <input type="text" id="note" placeholder="Describe...">

        <button type="button" id="create">CREATE & ADD EXCERCISE</button>
      </form>

    </div>

  </div>
<div id="display"></div>

</div>


</body>
